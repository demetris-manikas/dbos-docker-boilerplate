{{- define "template.deployment"}}
{{ $deploymentName := include "template.deployment.name" (dict "name" .name) }}

{{ $serviceName := .serviceName }}
{{ if not $serviceName }}
  {{ $serviceName = include "template.service.name" (dict "name" .name) }}
{{ end }}

{{ $containerCtx := dict
    "name" $serviceName
    "probe" .probe
    "image" .image
    "ports" .ports
    "resources" .deployment.resources
    "volumeMounts" .volumeMounts
    "envFrom" .envFrom
    "secretsFrom" .secretsFrom
}}

{{ $container := include "template.container" $containerCtx }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $deploymentName }}
spec:
  replicas: {{ .deployment.replicas }}
  selector:
    matchLabels:
      service: {{ $serviceName }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .deployment.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .deployment.rollingUpdate.maxUnavailable }}
  revisionHistoryLimit: {{ .deployment.revisionHistoryLimit }}
  template:
    metadata:
      creationTimestamp: null
      labels:
        service: {{ $serviceName }}
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            service:  {{ $serviceName }}
      securityContext:
      {{- if .securityContext }}
{{ toYaml .securityContext | indent 8 -}}
      {{- end }}
        sysctls:
          - name: "net.ipv4.ip_unprivileged_port_start"
            value: "0"
      {{- if .volumes }}
      volumes:
      {{- range .volumes }}
        -
{{ toYaml . | indent 10 -}}
      {{ end }}
      {{- end }}
      containers:
{{ $container | indent 8 }}
status: {}
{{ end -}}