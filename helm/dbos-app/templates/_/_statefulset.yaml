{{- define "template.statefulset"}}

{{ $statefulSet := .statefulset }}
{{ $name := .name }}
{{ $image := .image }}
{{ $ports := .ports }}
{{ $probe := .probe }}
{{ $podManagementPolicy := .podManagementPolicy }}
{{ $volumes := .volumes }}
{{ $volumeMounts := .volumeMounts }}
{{ $volumeClaimTemplates := .volumeClaimTemplates }}
{{ $resources := .resources }}
{{ $storage := $statefulSet.storage }}

{{ $serviceName := .serviceName }}
{{ if not $serviceName }}
  {{ $serviceName = include "template.service.name" .name }}
{{ end }}

{{ $statefulsetName := include "template.statefulset.name" $name }}

{{ $containerCtx := dict
    "name" $serviceName
    "probe" $probe
    "image" $image
    "ports" $ports
    "resources" $resources
    "volumeMounts" $volumeMounts
    "envFrom" .envFrom
    "secretsFrom" .secretsFrom
}}

{{ $container := include "template.container" $containerCtx }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $statefulsetName }}
spec:
  selector:
    matchLabels:
      service: {{ $serviceName }}
  serviceName: {{ $serviceName }}
  replicas: {{ $statefulSet.replicas }}
  revisionHistoryLimit: {{ $statefulSet.revisionHistoryLimit | default 10 }}
  {{- if $podManagementPolicy }}
    podManagementPolicy: {{ $podManagementPolicy }}
  {{- end }}
  minReadySeconds: 10
  template:
    metadata:
      labels:
        service: {{ $serviceName }}
    spec:
      terminationGracePeriodSeconds: 10
      {{- if $volumes }}
      volumes:
      {{- range $volumes }}
        -
{{ toYaml . | indent 10 -}}
      {{ end }}
      {{- end }}
      {{- if .securityContext }}
      securityContext:
{{ toYaml .securityContext | indent 8 -}}
        sysctls:
          - name: "net.ipv4.ip_unprivileged_port_start"
            value: "0"
      {{- end }}
      containers:
{{ $container | indent 6 }}
  {{- if $volumeClaimTemplates }}
  volumeClaimTemplates:
  {{- range $volumeClaimTemplates }}
  - metadata:
      name: {{ .name }}
    spec:
      accessModes:
        - {{ .accessMode }}
      storageClassName: {{ .className }}
      resources:
        requests:
          storage: {{ .size }}
  {{- end }}
  {{- end }}
{{ end -}}