{{ $config := .Values.keycloak_db }}
{{ $imageConfig := $config.image }}

{{ $persistentVolumeName := include "template.pv.name" $config.name }}
{{ $pvcName := include "template.pvc.name" $config.name }}

{{ $persistentVolume := (dict
  "name" $persistentVolumeName
  "persistentVolumeClaim" (dict "claimName" $pvcName)
  )
}}

{{ $persistentVolumeMount := (dict
  "name" $persistentVolumeName
  "mountPath" "/var/lib/postgresql"
)}}

{{ $ctx := dict
  "name" $config.name
  "probe" $config.probe
  "deployment" $config.deployment
  "resources" $config.deployment.resources
  "ports" $config.service.ports
  "envFrom" (list
    (include "template.configmap-env.name" $config.name)
  )
  "secretsFrom" (list
    (include "template.secrets.name" $config.name)
  )
  "image" (include "template.image" (dict
    "registry" .Values.registry
    "name" $imageConfig.name
    "tag" $imageConfig.tag
  ))
  "volumes" (list $persistentVolume)
  "volumeMounts" (list $persistentVolumeMount)
}}

{{ include "template.deployment" $ctx }}