backend_oauth2_proxy:
  name: backend-oauth2-proxy
  service:
    ports:
      "oauth2proxy":
        port: 4180
        targetPort: 4180
  pdb:
    minAvailable: 1
  image:
    name: "quay.io/oauth2-proxy/oauth2-proxy"
    tag: "v7.7.1"
  hosts:
    base:
      isMaintained: False
      paths:
        root:
          path: /oauth2
          pathType: Prefix
  resources:
    requests:
      memory: 100Mi
      cpu: 50m
    limits:
      memory: 1Gi
      cpu: 500m
  deployment:
    replicas: 1
    revisionHistoryLimit: 5
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 25%
    # probe:
    #   method:
    #     httpGet:
    #       path: /api/health
    #       port: 3000
    #   liveness:
    #     initialDelaySeconds: 5
    #     periodSeconds: 15
    #     timeoutSeconds: 10
    #     successThreshold: 1
    #     failureThreshold: 3
    #   readiness:
    #     initialDelaySeconds: 10
    #     periodSeconds: 30
    #     timeoutSeconds: 5
    #     successThreshold: 1
    #     failureThreshold: 10
  secrets:
    OAUTH2_PROXY_COOKIE_SECRET: cheangeme
  env:
    OAUTH2_PROXY_COOKIE_REFRESH: 1m30s
    OAUTH2_PROXY_COOKIE_SAMESITE: strict
    OAUTH2_PROXY_SHOW_DEBUG_ON_ERROR: true
    OAUTH2_PROXY_COOKIE_SECURE: false
    OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: true
    OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
    OAUTH2_PROXY_SKIP_JWT_BEARER_TOKENS: false
    OAUTH2_PROXY_SCOPE: openid profile email
    REDIS_DB_INDEX: 1