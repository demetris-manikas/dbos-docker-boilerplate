{{ $config := .Values.keycloak }}

{{ $imageConfig := $config.image }}

{{ $volumes := list }}
{{ $volumeMounts := list }}

{{ if eq $config.importRealms "true" }}
  {{ $volumeName := "keycloak-import-realms-volume" }}

  {{ $volume := dict
    "name" $volumeName
    "configMap" (dict "name" "keycloak-import-realms-configmap")
  }}

  {{ $volumes = append $volumes $volume }}

  {{ $realmVolumeMount := dict
    "name" $volumeName
    "mountPath" "/opt/keycloak/data/import/realm-app.json"
    "subPath" "realm-app.json"
  }}
  {{ $volumeMounts = append $volumeMounts $realmVolumeMount }}
{{ end }}

{{ $ctx := dict
  "name" $config.name
  "probe" $config.probe
  "deployment" $config.deployment
  "resources" $config.resources
  "ports" $config.service.ports
  "envFrom" (list
    (include "template.configmap-env.name" $config.name)
  )
  "secretsFrom" (list
    (include "template.secrets.name" $config.name)
  )
  "image" (include "template.image" (dict
    "registry" .Values.registry
    "name" $imageConfig.name
    "tag" $imageConfig.tag
  ))
  "volumeMounts" $volumeMounts
  "volumes" $volumes
}}

{{ include "template.deployment" $ctx }}