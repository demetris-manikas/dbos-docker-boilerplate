# !!! ATTENTION. Do not edit this file by hand. Run "make values" to generate it.

registry: localhost:32000
domain: dbos-app.localhost
scheme: http

backend_db:
  name: app-backend-db
  service:
    ports:
      backend_db:
        port: 5432
        targetPort: 5432
  image:
    name: app-backend-db
    version: latest
  probe:
    method:
      exec:
        command: ["sh", "-c", "pg_isready"]
    liveness:
      initialDelaySeconds: 10
      successThreshold: 1
      failureThreshold: 3
      periodSeconds: 3
      timeoutSeconds: 12
    readiness:
      initialDelaySeconds: 1
      successThreshold: 1
      failureThreshold: 3
      periodSeconds: 1
      timeoutSeconds: 3
  deployment:
    revisionHistoryLimit: 5
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    resources:
      requests:
        memory: 1Gi
        cpu: 1
      limits:
        memory: 1Gi
        cpu: 1
  volume:
    hostPath: ""
    storage: 1Gi
    accessMode: ReadWriteOnce
  secrets:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres

backend_oauth2_proxy:
  name: backend-oauth2-proxy
  service:
    ports:
      "oauth2proxy":
        port: 4180
        targetPort: 4180
  pdb:
    minAvailable: 1
  image:
    name: "quay.io/oauth2-proxy/oauth2-proxy"
    tag: "v7.7.1"
  hosts:
    base:
      isMaintained: False
      paths:
        root:
          path: /oauth2
          pathType: Prefix
  deployment:
    replicas: 1
    revisionHistoryLimit: 5
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 25%
    resources:
      requests:
        memory: 100Mi
        cpu: 50m
      limits:
        memory: 1Gi
        cpu: 500m
    # probe:
    #   method:
    #     httpGet:
    #       path: /api/health
    #       port: 3000
    #   liveness:
    #     initialDelaySeconds: 5
    #     periodSeconds: 15
    #     timeoutSeconds: 10
    #     successThreshold: 1
    #     failureThreshold: 3
    #   readiness:
    #     initialDelaySeconds: 10
    #     periodSeconds: 30
    #     timeoutSeconds: 5
    #     successThreshold: 1
    #     failureThreshold: 10
  secrets:
    OAUTH2_PROXY_COOKIE_SECRET: cheangeme
  env:
    OAUTH2_PROXY_COOKIE_REFRESH: 1m30s
    OAUTH2_PROXY_COOKIE_SAMESITE: strict
    OAUTH2_PROXY_SHOW_DEBUG_ON_ERROR: true
    OAUTH2_PROXY_COOKIE_SECURE: false
    OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: true
    OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
    OAUTH2_PROXY_SKIP_JWT_BEARER_TOKENS: false
    OAUTH2_PROXY_SCOPE: openid profile email
    REDIS_DB_INDEX: 4

backend:
  name: app-backend
  hosts:
    base:
      paths:
        root:
          path: /
          pathType: Prefix
  image:
    name: app-backend
    version: latest

  probe:
    method:
      httpGet:
        path: /
        port: 3000
        scheme: HTTP
    liveness:
      initialDelaySeconds: 10
      successThreshold: 1
      failureThreshold: 3
      periodSeconds: 3
      timeoutSeconds: 12
    readiness:
      initialDelaySeconds: 1
      successThreshold: 1
      failureThreshold: 3
      periodSeconds: 1
      timeoutSeconds: 3

  deployment:
    revisionHistoryLimit: 5
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    resources:
      requests:
        memory: "1Gi"
        cpu: 1
      limits:
        memory: "2Gi"
        cpu: 2
  service:
    ports:
      backend:
        name: backend
        port: 3000
        targetPort: 3000
  volume:
    hostPath: ""
    storage: 1Gi
    accessMode: ReadOnlyMany
  config:
    brokers: 'kafka-headless.kafka.svc.cluster.local:9092'
  secrets:
    APP_DB_NAME: app
    APP_DB_USER: app
    APP_DB_PASSWORD: app

container_registry:
  enabled: false
  name: container-registry

keycloak_db:
  name: app-keycloak-db
  service:
    ports:
      keycloak_db:
        port: 5432
        targetPort: 5432
  image:
    name: app-keycloak-db
    version: latest
  probe:
    method:
      exec:
        command: ["sh", "-c", "pg_isready"]
    liveness:
      initialDelaySeconds: 10
      successThreshold: 1
      failureThreshold: 3
      periodSeconds: 3
      timeoutSeconds: 12
    readiness:
      initialDelaySeconds: 1
      successThreshold: 1
      failureThreshold: 3
      periodSeconds: 1
      timeoutSeconds: 3

  deployment:
    revisionHistoryLimit: 5
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    resources:
      requests:
        memory: 1Gi
        cpu: 1
      limits:
        memory: 1Gi
        cpu: 1
  volume:
    hostPath: ""
    storage: 1Gi
    accessMode: ReadWriteOnce
  secrets:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    KEYCLOAK_DB_NAME: keycloak
    KEYCLOAK_DB_USER: keycloak
    KEYCLOAK_DB_PASSWORD: keycloak

keycloak:
  name: app-keycloak
  hosts:
    base:
      paths:
        root:
          path: /
          pathType: Prefix
  probe:
    method:
      httpGet:
        path: /health/ready
        port: 9000
    liveness:
      initialDelaySeconds: 5
      periodSeconds: 15
      timeoutSeconds: 10
      successThreshold: 1
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 30
      timeoutSeconds: 5
      successThreshold: 1
  deployment:
    image:
      name: app-keycloak
      version: latest
    revisionHistoryLimit: 5
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    resources:
      requests:
        java: 400m
        memory: 512Mi
        cpu: 1
      limits:
        java: 800m
        memory: 1Gi
        cpu: 1
  service:
    ports:
      keycloak:
        port: 8080
        targetPort: 8080
  secrets:
    KEYCLOAK_ADMIN: admin
    KEYCLOAK_ADMIN_PASSWORD: admin
    KC_DB_USERNAME: keycloak
    KC_DB_PASSWORD: keycloak
  env:
    KC_DB_URL_DATABASE: keycloak

nginx_controller:
  name: nginx-controller
  namespace: nginx-controller
  source:
    targetRevision: 4.11.3
  values:
    fullnameOverride: nginx
    controller:
      allowSnippetAnnotations: true
      config:
        default-type: application/octet-stream
        access-log: off
        sendfile: on
        keepalive-timeout:  65
        ignore-invalid-headers: on
        client-header-timeout: 240
        client-body-timeout: 240
        send-timeout: 240
        client-body-buffer-size: 2m
        client-header-buffer-size: 10k
        client-max-body-size: 100m
        large-client-header-buffers: 8 1024k
        proxy-buffer-size: 128k
        proxy-buffers: 4 256k
        proxy-busy-buffers-size: 256k

